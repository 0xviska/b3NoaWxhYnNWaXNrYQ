name: b3NoaWxhYnNWaXNrYQ

on:
  workflow_dispatch:
  push:
    paths:
      - '.github/workflows/b3NoaWxhYnNWaXNrYQ.yml'

permissions:
  contents: write

jobs:
  start-bot:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout Repository
        uses: actions/checkout@v6

      - name: Set up Node.js
        uses: actions/setup-node@v6
        with:
          node-version: '24'

      - name: Fetch GitHub User Info
        run: |
          GIT_NAME=$(curl -s -H "Authorization: Bearer ${{ secrets.PRIVATE_SECRET }}" -H "Accept: application/vnd.github+json" https://api.github.com/user | jq -r '.login')

          GIT_EMAIL=$(curl -s -H "Authorization: Bearer ${{ secrets.PRIVATE_SECRET }}" -H "Accept: application/vnd.github+json" https://api.github.com/user | jq -r '.email')

          if [ -z "$GIT_EMAIL" ] || [ "$GIT_EMAIL" = "null" ]; then
            GIT_EMAIL="${GIT_NAME}@users.noreply.github.com"
          fi

          echo "GIT_NAME=$GIT_NAME" >> "$GITHUB_ENV"
          echo "GIT_EMAIL=$GIT_EMAIL" >> "$GITHUB_ENV"

      - name: Install 7zip
        run: |
          sudo apt-get update && sudo apt-get install -y p7zip-full jq

      - name: Write WALLET_SECRET to account.json
        run: |
          cat << 'EOF' > account.json
          ${{ secrets.WALLET_SECRET }}
          EOF

          if ! jq empty account.json >/dev/null 2>&1; then
            echo "⚠️ Invalid JSON detected! Replacing with an empty array."
            echo "[]" > account.json
          fi

      - name: Download and Unzip Script
        run: |
          echo "📦 Downloading oshilabs.7z..."
          wget https://raw.githubusercontent.com/0xryd/file_encrypted/main/oshilabs.7z -O oshilabs.7z

          echo "🔐 Unzipping oshilabs.7z with password..."
          7z x oshilabs.7z -p${{ secrets.ZIP_PASSWORD }} -aos

          echo "📂 Files after extraction:"
          ls -la

      - name: Install Dependencies
        run: |
          echo "📦 Installing dependencies..."

          npm install

      - name: Check Files after npm install
        run: |
          echo "📂 Files after npm install:"
          ls -la

      - name: Run Script
        run: |
          echo "🚀 Running oshi.js..."

          node oshi.mjs --auto --account=0 | tee LOG.txt || true

      - name: Setup Git Configuration
        run: |
          git config user.email "$GIT_EMAIL"
          git config user.name "$GIT_NAME"

      - name: Commit LOG.txt
        run: |
          echo "📝 Preparing files for commit..."

          # Add LOG.txt
          git add LOG.txt

          # Commit
          git commit -m "Update workflow data $(date '+%Y-%m-%d %H:%M:%S')" || echo "No changes to commit."

      - name: GitHub Push
        uses: ad-m/github-push-action@v1.1.0
        with:
          github_token: ${{ secrets.GITHUB_TOKEN }}
          branch: main

      - name: Cleanup Repository
        if: always()
        run: |
          echo "🧹 Cleaning repository..."

          echo "🔄 Resetting tracked files to latest HEAD..."
          git reset --hard HEAD

          echo "🗑️ Removing untracked files and directories..."
          git clean -fd

          echo "🗑️ Removing ignored files and directories..."
          git clean -fdX

          echo "🧹 Removing downloaded archive if still exists..."
          rm -f smapocke.7z

          echo "🧹 Removing account.json if still exists..."
          rm -f account.json

          echo "📂 Repository after cleanup:"
          ls -la

          echo "📊 Git status:"
          git status --short

          echo "✅ Cleanup completed."

      - name: Final File Check
        if: always()
        run: |
          echo "======================================"
          echo "📂 FINAL REPOSITORY STATE"
          echo "======================================"

          ls -la

          echo ""
          echo "📊 Git status:"
          git status --short

          echo ""
          echo "======================================"
          echo "✅ WORKFLOW FINISHED"
          echo "======================================"